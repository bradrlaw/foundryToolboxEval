# Weekly version-update PRs; CI's offline checks run on each. requirements.txt files hold the tested pins, and
# pyproject.toml keeps looser ranges, so a bump only edits a range when the new version falls outside it.
# mcp is pinned in both requirements.txt files: keep the two pins equal.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # The sample server's image. A bump takes effect only after rebuilding and redeploying it (deploy/README.md).
  - package-ecosystem: pip
    directory: /sample-mcp-server
    schedule:
      interval: weekly
    groups:
      sample-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /sample-mcp-server
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
